<!DOCTYPE html>
<html>
  <head>
    <title>jVectorMap React DEMO</title>
    <link rel="stylesheet" href="jvectormap-next/jquery-jvectormap.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        background: #f6f7fb;
        color: #1f2937;
      }

      #root {
        max-width: 960px;
        margin: 0 auto;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "jquery": "https://cdn.jsdelivr.net/npm/jquery@4.0.0-beta/+esm",
          "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
          "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm",
          "react-vectormap": "./react-vectormap/dist/index.esm.js",
          "jvectormap-next": "./jvectormap-next/index.esm.js",
          "jvectormap-next/jquery-jvectormap.css": "data:text/javascript,export%20default%20undefined%3B",
          "jvectormap-content/world-mill": "./jvectormap-content/esm/world-mill.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { VectorMap, addMap } from 'react-vectormap';
      import worldMill from 'jvectormap-content/world-mill';

      addMap('world_mill', worldMill);

      const gdpData = {
        AF: 16.63,
        AL: 11.58,
        DZ: 158.97,
        // ...
      };

      function App() {
        const [selectedRegion, setSelectedRegion] = useState('FR');

        return (
          <>
            <div
              style={{
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                gap: '16px',
                marginBottom: '16px',
              }}
            >
              <div>
                <h1 style={{ margin: '0 0 8px', fontSize: '24px' }}>React VectorMap Demo</h1>
                <p style={{ margin: 0, color: '#4b5563' }}>
                  Click a region to update React state through react-vectormap.
                </p>
              </div>
              <button
                type="button"
                onClick={() => {
                  setSelectedRegion(null);
                }}
                style={{
                  border: 0,
                  borderRadius: '999px',
                  padding: '10px 14px',
                  background: '#111827',
                  color: '#fff',
                  cursor: 'pointer',
                }}
              >
                {selectedRegion ? `Clear selection (${selectedRegion})` : 'No region selected'}
              </button>
            </div>
            <div
              style={{
                height: '560px',
                borderRadius: '20px',
                overflow: 'hidden',
                background: '#fff',
                boxShadow: '0 18px 50px rgba(15, 23, 42, 0.08)',
              }}
            >
              <VectorMap
                map="world_mill"
                backgroundColor="#eef2ff"
                selectedRegions={selectedRegion ? [selectedRegion] : []}
                regionStyle={{
                  initial: {
                    fill: '#cbd5e1',
                  },
                  selected: {
                    fill: '#0f172a',
                  },
                }}
                series={{
                  regions: [
                    {
                      values: gdpData,
                      scale: ['#dbeafe', '#1d4ed8'],
                      normalizeFunction: 'polynomial',
                    },
                  ],
                }}
                onRegionClick={(event, code) => {
                  setSelectedRegion(code);
                }}
                onRegionTipShow={(event, label, code) => {
                  if (gdpData[code]) {
                    label.html(label.html() + ' (GDP - ' + gdpData[code] + ')');
                  }
                }}
              />
            </div>
          </>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
